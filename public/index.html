<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks</title><style>
*{box-sizing:border-box}body{margin:0;color:#253044;font:15px/1.6 system-ui;background:radial-gradient(at 0 0,#dbeaff,transparent 60%),radial-gradient(at 100% 40%,#f4dff5,transparent 65%),#f6f8fc;min-height:100dvh}main{max-width:680px;margin:auto;padding:24px 18px 100px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;letter-spacing:-1px}button,input,textarea{font:inherit}button{border:1px solid #fff9;border-radius:20px;padding:10px 17px;background:#ffffff90;color:#354666;cursor:pointer;box-shadow:0 3px 10px #607db514;transition:transform .2s,background .2s}button:active{transform:scale(.94)}.glass{background:#ffffff85;backdrop-filter:blur(24px) saturate(160%);border:1px solid #fff;border-radius:25px;box-shadow:0 14px 40px #54749e12,inset 0 1px 2px white}form{padding:17px;position:sticky;top:10px;z-index:3}textarea{width:100%;border:0;outline:none;background:transparent;resize:none;min-height:78px;font-size:18px;color:inherit}.form-bottom{display:flex;justify-content:space-between;align-items:center}.primary{background:#496bee;color:white}.tabs{display:flex;gap:7px;margin:24px 0;overflow:auto}.tabs button{white-space:nowrap}.selected{background:#30405e;color:white}.task{position:relative;padding:18px;margin:12px 0;touch-action:pan-y;transition:transform .25s,opacity .2s;animation:enter .3s both}.task h2{font-size:17px;margin:0 0 10px;overflow-wrap:anywhere}.task small{color:#6b7890}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.status{font-size:12px;padding:4px 10px;background:#e7edff;border-radius:14px}.done h2{text-decoration:line-through;color:#8590a3}nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:8px;display:flex;gap:8px;z-index:4;white-space:nowrap}nav button{box-shadow:none;background:transparent}.empty{text-align:center;color:#7d899a;padding:35px}#notice{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:6;background:#253044;color:white;padding:12px 18px;border-radius:20px;display:none;width:max-content;max-width:90vw}#loading{position:fixed;inset:0;background:#f5f8fc;z-index:2;padding:230px max(18px,calc((100vw - 644px)/2)) 20px;pointer-events:none}#loading i{display:block;height:85px;margin:15px 0;border-radius:24px;background:linear-gradient(100deg,#e4eaf2 20%,#fafcff 50%,#e4eaf2 80%);background-size:200% 100%;animation:shimmer 1s infinite}body.ready #loading{display:none}section{animation:enter .25s}label{display:block;margin:12px 0}input{padding:12px;border:1px solid #dae1ed;border-radius:12px;width:100%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats div{text-align:center;padding:20px 5px}.stats b{display:block;font-size:24px}.habit{margin:10px 0;padding:16px}.muted{font-size:12px;color:#7d899a}dialog{border:0;max-width:400px;width:90%;padding:25px;border-radius:25px}dialog::backdrop{backdrop-filter:blur(6px);background:#40547744}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(min-width:700px){main{padding-top:35px}}:focus-visible{outline:2px solid #496bee;outline-offset:3px}
</style><main><header><h1>Tasks</h1><span id="save" class="muted">端末に保存</span></header><form id="capture" class="glass"><textarea autofocus id="memo" maxlength="2000" placeholder="メモ・タスクを入力" aria-label="メモ・タスク"></textarea><div class="form-bottom"><span class="muted" id="draftState">下書き保存</span><button class="primary">＋ 追加</button></div></form><div id="content"></div></main><div id="loading" aria-label="読み込み中"><i></i><i></i><i></i></div><nav class="glass"><button data-page="tasks">タスク</button><button data-page="habits">習慣</button><button data-page="growth">成長</button><button data-page="settings">設定</button></nav><div id="notice" role="status"></div><script src="engine.js"></script><script src="ui.js"></script></html>
